name: releaseBuild.yml

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build (e.g. main or v4.0.0)'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  release:
    # If the commit is tagged with a version (e.g. "v1.0.0"),
    # release the app after building
    # if: ${{ startsWith(github.ref, 'refs/tags/v') }}

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
      NODE_ENV: development

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install canvas build deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install canvas build deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install pkg-config cairo pango libpng jpeg giflib librsvg

      - name: Install dependencies
        run: yarn install
        env:
          YARN_ENABLE_SCRIPTS: "false"

      - name: Build Electron app (branch/manual non-tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: yarn run dist --dir --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish release assets (tag)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: yarn run dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
